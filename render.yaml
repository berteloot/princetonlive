services:
  - type: static_site
    name: princetonlive
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
      # Six months, no includeSubDomains yet. Widen only after every berteloot.org
      # subdomain is confirmed HTTPS-only, because the directive is hard to walk back.
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=15552000"
      # Enforcing. Verified on the live site by enumerating every network request the
      # page actually makes with Recycle Coach loaded, Google Translate loaded, and the
      # address lookup submitted: recyclecoach.com, region1.google-analytics.com,
      # translate.googleapis.com and nominatim.openstreetmap.org are all covered, and
      # nothing was reported as violating while it ran in report-only mode.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://cdn.recyclecoach.com https://*.recyclecoach.com; style-src 'self' 'unsafe-inline' https://www.gstatic.com https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://nominatim.openstreetmap.org https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://*.recyclecoach.com; frame-src https://*.recyclecoach.com https://www.google.com; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'self'"
      # The JSON feeds are advertised in llms.txt as machine-readable endpoints.
      - path: /live-data.json
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /civic-map.json
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /waste-data.json
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
