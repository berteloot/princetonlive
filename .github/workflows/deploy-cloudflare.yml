name: Deploy to Cloudflare Workers

# Render deployed on every push to main and rebuilt the data on each deploy.
# This job replaces both. If it stops running, the site freezes at the last
# deploy while the refresh job keeps reporting green, and freshness.json and
# garden-theatre.json (rebuilt only at build time) age past the monitor limits.
on:
  push:
    branches: [main]

  # "Refresh public data" pushes with the default GITHUB_TOKEN, and GitHub
  # starts no workflow run from a push made with that token. Render's webhook
  # was never subject to that rule. Running after every successful refresh also
  # rebuilds freshness.json when the refresh had nothing to commit.
  workflow_run:
    workflows:
      - Refresh public data
    types: [completed]

  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same command Render ran: refresh the public data, then build.
      - name: Build
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          CENSUS_ACS_YEAR: ${{ vars.CENSUS_ACS_YEAR }}
        run: npm run build

      # dist/_headers carries the security headers render.yaml used to own, and
      # dist/_redirects serves / and /guides/ (html_handling is "none" so the
      # .html URLs in the sitemap are not redirected). Fail here rather than
      # ship a site with no CSP or a 404 homepage.
      - name: Verify headers and rewrites survived the build
        run: |
          set -euo pipefail
          grep -q "Content-Security-Policy" dist/_headers
          grep -q "Strict-Transport-Security" dist/_headers
          grep -q "^/guides/ /guides/index.html 200" dist/_redirects
          echo "dist/_headers and dist/_redirects present."

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # A deploy reports success as soon as Cloudflare accepts the upload, and
      # edges can serve 404s for several seconds after that.
      - name: Verify the live site
        run: |
          set -euo pipefail
          URL="https://princetonlive.berteloot.org"
          deadline=$(( $(date +%s) + 180 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            home=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL/" || echo 000)
            guide=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL/guides/moving-to-princeton.html" || echo 000)
            data=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL/live-data.json" || echo 000)
            miss=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL/no-such-page" || echo 000)
            echo "homepage=$home guide=$guide live-data=$data missing=$miss"
            if [ "$home" = "200" ] && [ "$guide" = "200" ] && [ "$data" = "200" ] && [ "$miss" = "404" ]; then
              echo "Live site verified."
              exit 0
            fi
            sleep 10
          done
          echo "Live site did not settle within 180s of the deploy."
          exit 1
