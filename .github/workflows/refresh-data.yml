name: Refresh public data

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh public data snapshot
        run: npm run refresh:public
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          CENSUS_ACS_YEAR: ${{ vars.CENSUS_ACS_YEAR }}

      - name: Commit data snapshot
        run: |
          if git diff --quiet -- public/live-data.json public/civic-map.json public/waste-data.json; then
            echo "No public data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/live-data.json public/civic-map.json public/waste-data.json
          git commit -m "Refresh Princeton public data"
          git push
