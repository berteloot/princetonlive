name: Refresh public data

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh public data snapshot
        run: npm run refresh:public
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          CENSUS_ACS_YEAR: ${{ vars.CENSUS_ACS_YEAR }}

      - name: Commit data snapshot
        run: |
          if git diff --quiet -- public/live-data.json public/civic-map.json; then
            echo "No public data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/live-data.json public/civic-map.json
          git commit -m "Refresh Princeton public data"
          git push
